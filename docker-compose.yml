services:
  db:
    image: postgres:16
    container_name: logicle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logicle
      # Consumed by db/init/002_create_app_role.sh on a fresh data volume.
      # Override APP_DB_PASSWORD in your shell or .env before `docker compose up`.
      APP_DB_USER: logicle_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_password_change_me}
    # Bind to loopback only so the DB isn't reachable from other hosts on the
    # network. Drop the `ports:` block entirely once the API runs in the same
    # docker network and connects via the service name.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: